<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonora - Music Playlist Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/neumorphism.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

  <div class="auth-wrapper">
    <header class="auth-header">
      <div class="logo-container" id="adminLogoBtn" tabindex="0">
        <img src="{{ url_for('static', filename='images/sonora.png') }}" alt="Sonora Logo" class="brand-logo-img">
      </div>
      <h1 class="brand-title">SONORA</h1>
      <p class="brand-tagline">Music Playlist Management System</p>
    </header>

    <main class="auth-card neu-card">
      <nav class="auth-tabs" aria-label="Authentication Options">
        <button type="button" class="tab-btn neu-btn active" id="tabSignIn">Sign In</button>
        <button type="button" class="tab-btn neu-btn" id="tabRegister">Register</button>
      </nav>

      <form id="signInForm" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label class="neu-label" for="loginUsername">Username or Email</label>
          <input type="text" id="loginUsername" class="neu-input" placeholder="e.g. melodymaster" required>
        </div>

        <div class="form-group">
          <label class="neu-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="neu-input" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="neu-btn neu-btn-primary submit-btn">
          <span>Sign In to Sonora</span>
        </button>

        <div class="auth-footer-actions">
          <button type="button" class="quick-fill-btn" id="fillDemoUser">
            Quick Fill Demo User (melodymaster)
          </button>
        </div>
      </form>

      <form id="registerForm" class="auth-form hidden" autocomplete="off">
        <div class="form-group">
          <label class="neu-label" for="regUsername">Username</label>
          <input type="text" id="regUsername" class="neu-input" placeholder="Choose a username (min 3 chars)" required minlength="3">
        </div>

        <div class="form-group">
          <label class="neu-label" for="regEmail">Email Address</label>
          <input type="email" id="regEmail" class="neu-input" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <label class="neu-label" for="regPassword">Password</label>
          <input type="password" id="regPassword" class="neu-input" placeholder="Create a secure password (min 6 chars)" required minlength="6">
        </div>

        <div class="form-group">
          <label class="neu-label" for="regGenre">Preferred Music Genre</label>
          <select id="regGenre" class="neu-select">
            <option value="Lo-Fi">Lo-Fi Beats</option>
            <option value="Synthwave">Synthwave &amp; Retro</option>
            <option value="Jazz">Jazz &amp; Blues</option>
            <option value="Acoustic">Acoustic &amp; Folk</option>
            <option value="Electronic">Electronic &amp; Ambient</option>
            <option value="Classical">Modern Classical</option>
          </select>
        </div>

        <button type="submit" class="neu-btn neu-btn-amber submit-btn">
          <span>Create My Account</span>
        </button>
      </form>
    </main>
  </div>

  <div class="admin-modal-overlay" id="adminModal">
    <div class="admin-modal-box neu-card">
      <div class="admin-modal-header">
        <div class="neu-badge neu-badge-amber">Administrator</div>
        <button type="button" class="close-modal-btn" id="closeAdminModal">&times;</button>
      </div>
      <div class="admin-modal-body">
        <div class="modal-icon-disc neu-card-inset">
          <svg viewBox="0 0 24 24" width="36" height="36" stroke="#E09F3E" fill="none" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h3>Administrator Access</h3>
        <p>Access the administrative dashboard to monitor the system and manage the music catalog.</p>
        
        <button type="button" class="neu-btn neu-btn-primary btn-block" id="btnAdminDirectAuthorize">
          <span>Enter Admin Dashboard</span>
        </button>
      </div>
    </div>
  </div>

  <div id="toastNotification" class="neu-toast" role="alert" aria-live="assertive"></div>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
